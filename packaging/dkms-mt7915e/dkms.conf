# DKMS configuration for mt7915e (MediaTek MT7915/MT7916 PCIe Wi-Fi) on
# kernels that ship mt76 but not this driver (Raspberry Pi OS: CONFIG_MT7915E
# is not set). PACKAGE_VERSION is substituted by install-mt7915e-dkms.sh.
#
# The package carries no driver source. build-mt7915e.sh fetches the mt76
# source of the exact kernel being built for, so the driver always matches
# the kernel's own mt76.ko and mt76-connac-lib.ko. Rebuilding old source
# against a newer kernel would load without complaint and corrupt memory
# if mt76's structures had changed.
PACKAGE_NAME="trellis-mt7915e"
PACKAGE_VERSION="@VERSION@"
BUILT_MODULE_NAME[0]="mt7915e"
BUILT_MODULE_LOCATION[0]="out"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="sh ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/build-mt7915e.sh ${kernelver} ${kernel_source_dir}"
CLEAN="rm -rf ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/out ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/src"
AUTOINSTALL="yes"
