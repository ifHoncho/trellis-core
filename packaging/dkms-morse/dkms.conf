# DKMS configuration for Morse Micro's out-of-tree Wi-Fi HaLow driver
# ("morse": MM6108 and MM8108 chips),
# built for SPI. PACKAGE_VERSION is substituted by install-wm6108-halow.sh.
#
# The package carries no driver source, only Trellis's patches.
# build-morse.sh fetches Morse Micro's source at a pinned commit (cached, so
# rebuilds after kernel updates need no network) and applies them.
PACKAGE_NAME="trellis-morse"
PACKAGE_VERSION="@VERSION@"
BUILT_MODULE_NAME[0]="morse"
BUILT_MODULE_LOCATION[0]="out"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="sh ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/build-morse.sh ${kernelver} ${kernel_source_dir}"
CLEAN="rm -rf ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/out ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/src"
AUTOINSTALL="yes"
