# Trellis mesh time. Installed in chrony's conf.d by scripts/install-node.sh
# and replaced on every update; the distribution's chrony.conf, and the
# internet servers in it, stay as they are.
#
# A node with a GNSS receiver (through gpsd) takes its time from it and
# serves it to the mesh. The others follow the nodes that serve time: meshd
# lists them, from gossip, in the source directory below. With no GNSS and
# no internet, the nodes still agree among themselves (orphan mode).

# The mesh's time servers, kept by meshd.
sourcedir /run/trellis-chrony

# GNSS time from gpsd's shared memory. Unit 0 is the time in the receiver's
# NMEA sentences: good to about a tenth of a second at 9600 baud. Unit 1 is
# the pulse per second, where the board wires it to a GPIO: microseconds.
# On a node without a receiver these never deliver a sample.
refclock SHM 0 refid GNSS precision 1e-1 delay 0.2 poll 3
refclock SHM 1 refid PPS precision 1e-7 lock GNSS poll 3

# Serve the mesh (the default mesh prefix), and nobody else.
allow 10.73.0.0/16

# With no source at all, keep serving this node's clock: nodes without a
# real upstream then settle on one of them.
local stratum 10 orphan
