# A CM4 with an AsiaRF AW7916-AED (MT7916, M.2 A+E, PCIe) and a Seeed
# Wio-WM6108 HaLow module in a WM1302 Pi HAT, whose GPS receiver is on the
# primary UART. Raspberry Pi OS Lite arm64. Read by scripts/build-image.sh and, in the image,
# packaging/image/customize.sh: shell variables only.

BOARD_DESC="CM4: AW7916 (MT7916) Wi-Fi, Wio-WM6108 HaLow, GPS on the UART"

# The base image, checked by the SHA-256 of the uncompressed .img
# (Raspberry Pi's image list gives that one).
BASE_URL=https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2026-10-06/2026-10-06-raspios-trixie-arm64-lite.img.xz
BASE_IMG_SHA256=b8a393dc1c3701450b5fffbfe74368a98fb6eab7415ce456cc0cead886ea8780

# Room for kernel headers, compilers and DKMS builds while the image is
# built; the root filesystem is shrunk back afterwards, and grows to fill
# the card at its first boot (Raspberry Pi OS does that).
GROW_MB=3072

# Kernels the image boots: the CM4 and Pi 4 run rpi-v8 (rpi-2712 is the
# Pi 5's, removed). Modules are built for the newest kernel of each.
# REMOVE_PACKAGES: dpkg patterns.
KERNEL_FLAVOURS="rpi-v8"
REMOVE_PACKAGES="linux-image-*rpi-2712 linux-headers-*rpi-2712"

# Beyond the trellis package's own dependencies: its recommends, the DKMS
# builds, MT7916 firmware and gpsd for the HAT's GPS (not gpsd-clients:
# xgps pulls in GTK).
PACKAGES="dkms build-essential git device-tree-compiler linux-headers-rpi-v8 \
  firmware-mediatek batctl libopus0 libasound2t64 gpsd curl"

# Drivers built into the image (install-*-dkms.sh in image mode).
DRIVERS="mt7915e morse"
# Morse's userspace (wpa_supplicant_s1g, morse_cli): built from source.
HALOW_TOOLS=yes
# Morse's firmware (mm6108.bin) and its licence in the image: Morse's
# licence allows it, unmodified, for Morse hardware. The BCF is not: it
# comes from the card, the node's uplink or another node.
HALOW_FIRMWARE=yes

# Device tree overlays compiled from packaging/overlays/ into the boot
# partition, and the config.txt lines, appended under [all].
OVERLAYS="trellis-pcie-gen1 trellis-wm6108-spi"
CONFIG_TXT="enable_uart=1
dtoverlay=disable-bt
dtoverlay=pcie-32bit-dma
dtoverlay=trellis-pcie-gen1
dtoverlay=trellis-wm6108-spi"

# The GPS is on the console UART: the kernel console and the login prompt
# come off it (a receiver's data on the console can reach Magic SysRq and
# reset the board), and gpsd reads it without reconfiguring the receiver.
CONSOLE_OFF_UART=yes
MASK_UNITS="serial-getty@ttyAMA0.service serial-getty@serial0.service hciuart.service"
GPSD_DEVICES=/dev/serial0
GPSD_OPTIONS="-n -b"
